<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/registration.css">
    <script src="/js/registration.js" defer></script>
</head>
<body>
    <div id="message-field"></div>
    <main>
        <h1>Register your account</h1>
        <form>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required maxlength="20" placeholder="Max">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required maxlength="20" placeholder="max123">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required maxlength="50" placeholder="example@gmail.com">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>

            <button type="submit">Register</button>
        </form>
        <p>If you already have an account, you can <a href="login">login here</a></p>
    </main>
</body>
</html>
